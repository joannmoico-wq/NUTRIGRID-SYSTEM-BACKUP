<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ec4899">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriGrid">
    <meta name="description" content="Barangay Nutrition Scholar health data collection system">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <title>NutriGrid: A BNS MMADS System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Clear stale PWA assets before loading Vite modules in development. -->
    <script type="module">
      async function bootstrap() {
        if ('serviceWorker' in navigator) {
          if (import.meta.env.DEV) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            const appScope = new URL('/', window.location.origin).href;
            await Promise.all(
              registrations
                .filter((registration) => registration.scope === appScope)
                .map((registration) => registration.unregister())
            );

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith('nutrigrid-'))
                  .map((cacheName) => caches.delete(cacheName))
              );
            }
          } else {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
                .then(() => console.log('NutriGrid service worker registered'))
                .catch((error) => console.error('NutriGrid service worker registration failed:', error));
            });
          }
        }

        await import('/src/main.jsx');
      }

      bootstrap();
    </script>
  </body>
</html>
